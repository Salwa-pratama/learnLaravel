version: "3.9"

services:
  app:
    build: .
    container_name: laravel_app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
      - "5173:5173"
    command: >
      sh -c "
      composer install &&
      npm install &&
      php artisan key:generate &&
      php artisan serve --host=0.0.0.0 --port=8000 &
      npm run dev -- --host
      "
